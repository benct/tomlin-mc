name: Deploy Next.js App to Web Container
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands for deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd /var/www/tomlin-mc

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            pm2 restart tomlin-mc --update-env || PORT=3000 pm2 start npm --name "tomlin-mc" -- start
            pm2 save
